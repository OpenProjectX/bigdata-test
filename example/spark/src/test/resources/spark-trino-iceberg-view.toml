[services]
hiveMetastore = true
s3 = true
fakeGcs = true
trino = true

[trino]
catalogName = "iceberg"

[trino.catalogProperties]
"connector.name" = "iceberg"
"iceberg.catalog.type" = "hive_metastore"

[containers.trino.files]
"/etc/trino/catalog/hive.properties" = "classpath:trino/hive.properties"

[containerLogs]
mode = "FILE"
directory = "build/bigdata-test-container-logs"
append = false
