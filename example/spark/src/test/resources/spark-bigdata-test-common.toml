[images]
kerberos = "ghcr.io/openprojectx/directory-kerby/kerby-kdc:latest"
hdfs = "ghcr.io/openprojectx/dockerhub/apache/hadoop:3.5.0"
hiveMetastore = "ghcr.io/openprojectx/hive:3.1.3-hadoop-3.4.2-gcs-4.0.4-jdk17-0.1.5"
hiveMetastorePostgres = "ghcr.io/openprojectx/dockerhub/library/postgres:16-alpine"
hiveMetastoreMysql = "ghcr.io/openprojectx/dockerhub/library/mysql:8.0.44-bookworm"
clouderaHms = "ghcr.io/openprojectx/cloudera-hms:0.1.74"
clouderaHmsMariadb = "ghcr.io/openprojectx/cloudera-hms:0.1.74-mariadb"
kafka = "ghcr.io/openprojectx/dockerhub/apache/kafka:4.1.2"
schemaRegistry = "ghcr.io/openprojectx/dockerhub/confluentinc/cp-schema-registry:7.8.0"
kafkaUi = "ghcr.io/kafbat/kafka-ui:latest"
s3 = "ghcr.io/openprojectx/dockerhub/floci/floci:1.7.0"
fakeGcs = "ghcr.io/openprojectx/dockerhub/floci/floci-gcp:0.5.0"

[services]
hdfs = true
kafka = true
schemaRegistry = true
s3 = true
fakeGcs = true

[ports]
hdfsDataNode = 9866
hdfsNameNode = 8020

[containerLogs]
mode = "FILE"
append = false

[containerLogLevels]
kafka = "INFO"
