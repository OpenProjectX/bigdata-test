[images]
kerberos = "openprojectx/kerby-kdc:latest"
hdfs = "apache/hadoop:3.5.0"
hiveMetastore = "ghcr.io/openprojectx/hive:3.1.3-hadoop-3.4.2-gcs-4.0.4-jdk17-0.1.4"
hiveMetastorePostgres = "postgres:16-alpine"
clouderaHms = "ghcr.io/openprojectx/cloudera-hms:0.1.16"
kafka = "apache/kafka:4.1.2"
schemaRegistry = "confluentinc/cp-schema-registry:7.8.0"
kafkaUi = "ghcr.io/kafbat/kafka-ui:latest"
localStackS3 = "localstack/localstack:4.14.0"
fakeGcs = "fsouza/fake-gcs-server:1.54"

[services]
kerberos = true
hdfs = true
hiveMetastore = true
kafka = true
kafkaKerberos = true
schemaRegistry = true
localStackS3 = true
fakeGcs = true

[ports]
kafka = 19092

[containerLogs]
mode = "FILE"

[s3Jceks]
enabled = true
hdfsDir = "/bigdata-test/spark"
fileName = "s3.jceks"

[kafkaAvro]
enabled = true

[kerberosMaterial]
enabled = true

[[kafkaAvro.topics]]
name = "spark-avro-events"
schema = "classpath:schemas/spark-event.avsc"
records = [
  { key = "alpha", value = { id = 1, name = "alpha" } },
  { key = "beta", value = { id = 2, name = "beta" } },
]
