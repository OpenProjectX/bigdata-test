[services]
kerberos = false
hdfsKerberos = false
hdfs = true

localStackS3 = true
#schemaRegistry = true
#kafka = true

[kerberos]
realm = "EXAMPLE.COM"
domain = "example.com"
materialDirectory = "build/bigdata-test/kerberos"
localKrb5ConfPath = "build/bigdata-test/kerberos/krb5.conf"
localClientKeytabPath = "build/bigdata-test/kerberos/app_user.keytab"
debug = true

[hdfs]
dataNodeHostname = "localhost"
localHdfsSitePath = "build/bigdata-test/hadoop/hdfs-site.xml"

[ports]
hdfsNameNode = 8020
hdfsDataNode = 9866
hdfsWeb = 9870
localStackS3 = 4566

[containerLogs]
mode = "FILE"
directory = "build/container-logs"
append = false

[containerLogLevels]
kerberos = "DEBUG"
hdfs = "DEBUG"

[containers.localstackS3.env]
DISABLE_CORS_CHECKS = "1"

#[containers.hdfs.env]
#TEST_ENV = "TEST"
