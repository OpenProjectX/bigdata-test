[services]
kerberos = true
hdfsKerberos = true
hdfs = true
hiveMetastore = false
clouderaHms = true

localStackS3 = true
#schemaRegistry = true
#kafka = true

[hiveMetastore]
databaseType = "mysql"
databaseName = "metastore"
databaseUser = "hive"
databasePassword = "hive"
# Optional: use a fixed host port for local database troubleshooting.
#databaseHostPort = 3306
databaseHostPort = 0

[clouderaHms]
databaseType = "mariadb"
databaseName = "metastore"
databaseUser = "hive"
databasePassword = "hive"
# Optional. 0 means Testcontainers picks a random host port for 3306.
databaseHostPort = 3306


[kerberos]
realm = "EXAMPLE.COM"
domain = "example.com"
materialDirectory = "build/bigdata-test/kerberos"
localKrb5ConfPath = "build/bigdata-test/kerberos/krb5.conf"
localClientKeytabPath = "build/bigdata-test/kerberos/app_user.keytab"
debug = true

[hdfs]
dataNodeHostname = "localhost"
localHdfsSitePath = "build/bigdata-test/hadoop/hdfs-site.xml"

[ports]
# Dynamic ports are the default and avoid conflicts when a previous
# bigDataTestRun is still alive. Uncomment these when you need stable local
# ports for manual troubleshooting.
#hdfsNameNode = 8020
# The JCEKS extension writes to HDFS from the Gradle JVM. HDFS advertises the
# DataNode service port to that client, so the host port must match it when
# dataNodeHostname = "localhost".
hdfsDataNode = 9866
#hdfsWeb = 9870
#localStackS3 = 4566
hiveMetastore = 9083

[containerLogs]
mode = "STDOUT"
directory = "build/container-logs"
append = false

[containerLogLevels]
kerberos = "DEBUG"
hdfs = "DEBUG"

[containers.localstackS3.env]
DISABLE_CORS_CHECKS = "1"

#[containers.hdfs.env]
#TEST_ENV = "TEST"
