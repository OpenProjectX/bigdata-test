# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.2.21"
kotlinxDatetime = "0.7.1"
kotlinxSerializationJSON = "1.9.0"
kotlinxCoroutines = "1.10.2"
springBoot = "4.0.5"
testcontainers = "2.0.4"
hiveDockerTestcontainers = "0.1.5"
spark = "3.5.7"
spark4 = "4.1.1"
hadoop = "3.4.2"
kafka = "4.1.2"
javaDns = "0.1.1"
slf4j = "2.0.17"

junitJupiter = "5.14.1"
junitPlatform = "1.14.1"
iceberg = "1.11.0"
confluent = "8.2.1"
avro = "1.12.1"
lz4 = "1.10.1"
gcsConnector = "4.0.4"
gcsio = "4.0.4"
googleCloudStorage = "2.59.0"
bouncycastle = "1.83"
awsSdk = "2.41.5"
mysqlConnector = "8.4.0"
servletApi = "4.0.1"
jtoml = "2.0.0"
trino = "483"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinSpringPlugin = { module = "org.jetbrains.kotlin.plugin.spring:org.jetbrains.kotlin.plugin.spring.gradle.plugin", version.ref = "kotlin" }

kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
testcontainersBom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainersPostgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainersMysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainersKafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainersElasticsearch = { module = "org.testcontainers:testcontainers-elasticsearch" }
testcontainersJunitJupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
kafkaClients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
hiveDockerTestcontainers = { module = "org.openprojectx.hive.docker.core:hive-docker-testcontainers", version.ref = "hiveDockerTestcontainers" }
sparkSql = { module = "org.apache.spark:spark-sql_2.12", version.ref = "spark" }
sparkHive = { module = "org.apache.spark:spark-hive_2.12", version.ref = "spark" }
sparkSqlKafka = { module = "org.apache.spark:spark-sql-kafka-0-10_2.12", version.ref = "spark" }
spark4Sql = { module = "org.apache.spark:spark-sql_2.13", version.ref = "spark4" }
spark4Hive = { module = "org.apache.spark:spark-hive_2.13", version.ref = "spark4" }
icebergSpark4 = { module = "org.apache.iceberg:iceberg-spark-4.1_2.13", version.ref = "iceberg" }
icebergSpark4Extensions = { module = "org.apache.iceberg:iceberg-spark-extensions-4.1_2.13", version.ref = "iceberg" }
hadoopAws = { module = "org.apache.hadoop:hadoop-aws", version.ref = "hadoop" }
hadoopClientApi = { module = "org.apache.hadoop:hadoop-client-api", version.ref = "hadoop" }
hadoopClientRuntime = { module = "org.apache.hadoop:hadoop-client-runtime", version.ref = "hadoop" }


sparkAvro = { module = "org.apache.spark:spark-avro_2.12", version.ref = "spark" }
icebergSpark = { module = "org.apache.iceberg:iceberg-spark-3.5_2.12", version.ref = "iceberg" }
icebergSparkExtensions = { module = "org.apache.iceberg:iceberg-spark-extensions-3.5_2.12", version.ref = "iceberg" }
icebergHiveMetastore = { module = "org.apache.iceberg:iceberg-hive-metastore", version.ref = "iceberg" }
icebergAwsBundle = { module = "org.apache.iceberg:iceberg-aws-bundle", version.ref = "iceberg" }
gcsConnector = { module = "com.google.cloud.bigdataoss:gcs-connector", version.ref = "gcsConnector" }
gcsio = { module = "com.google.cloud.bigdataoss:gcsio", version.ref = "gcsio" }
gcsUtilHadoop = { module = "com.google.cloud.bigdataoss:util-hadoop", version.ref = "gcsConnector" }
googleCloudStorage = { module = "com.google.cloud:google-cloud-storage", version.ref = "googleCloudStorage" }
kafkaAvroSerializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }
kafkaSchemaRegistryClient = { module = "io.confluent:kafka-schema-registry-client", version.ref = "confluent" }
lz4Java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junitJupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
bouncycastlePkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastleProvider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
awsSdkS3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
awsSdkS3TransferManager = { module = "software.amazon.awssdk:s3-transfer-manager", version.ref = "awsSdk" }
servletApi = { module = "javax.servlet:javax.servlet-api", version.ref = "servletApi" }
mysqlConnector = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnector" }
jtoml = { module = "io.ous:jtoml", version.ref = "jtoml" }
trinoJdbc = { module = "io.trino:trino-jdbc", version.ref = "trino" }

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
javaDns = { id = "org.openprojectx.java.dns", version.ref = "javaDns" }
shadow = { id = "com.gradleup.shadow", version = "9.4.2" }
